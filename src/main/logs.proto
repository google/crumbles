syntax = "proto3";

package wireless_android_security_exploits_secure_logging_src_main;

import "google/protobuf/timestamp.proto";

option java_package =
    "com.google.protos.wireless_android_security_exploits_secure_logging_src_main";
option java_multiple_files = true;

enum LogEncryptionType {
  LOG_ENCRYPTION_TYPE_UNSPECIFIED = 0;
  LOG_ENCRYPTION_TYPE_AES_GCM = 1;
  // AES-GCM over the logs padded to a size bucket: the length of the logs as a
  // 4-byte big-endian integer, the logs, then zero bytes up to the next power
  // of two of at least 4096 bytes. blob_size then reveals only the bucket.
  LOG_ENCRYPTION_TYPE_AES_GCM_PADDED = 2;
  // Format version 2: as LOG_ENCRYPTION_TYPE_AES_GCM_PADDED, but what is padded
  // is a serialized SealedLogs, which also holds the timestamp and the device
  // identifier of the batch and the attestation chain of the key that signs it.
  // The cleartext metadata then carries only blob_size and this encryption
  // type, and the cleartext signature only the signature itself. The associated
  // data starts with the label "crumbles/v2/batch" and ends with the SHA-256
  // digest of the recipient's public key (its DER SubjectPublicKeyInfo).
  LOG_ENCRYPTION_TYPE_AES_GCM_SEALED_METADATA = 3;
}

// LINT.IfChange
// What a LOG_ENCRYPTION_TYPE_AES_GCM_SEALED_METADATA batch pads and encrypts.
message SealedLogs {
  // The fields of the batch metadata that its cleartext metadata leaves out:
  // the timestamp and the device identifier.
  LogMetadata metadata = 1;
  optional bytes logs = 2;
  // DER-encoded X.509 certificates of the installation's batch-signing key
  // from Android key attestation, leaf first, sealed inside the ciphertext so
  // that the device identifier in the attestation challenge and the OS
  // verified-boot key and patch level are not exposed in cleartext.
  repeated bytes attestation_chain = 3;
}
// LINT.ThenChange(../../tools/analyst/crumbles_analyst.py)

// LINT.IfChange
enum KeyEncryptionType {
  KEY_ENCRYPTION_TYPE_UNSPECIFIED = 0;
  KEY_ENCRYPTION_TYPE_ASYMMETRIC = 1;
  KEY_ENCRYPTION_TYPE_CERT_SHA256_WITH_RSA = 2;
  reserved 3;
  reserved "KEY_ENCRYPTION_TYPE_CIPHER_MODE_RSA_ECB_PKCS1";
  KEY_ENCRYPTION_TYPE_RSA_OAEP_SHA256 = 4;
}
// LINT.ThenChange(../../tools/analyst/crumbles_analyst.py)

// LINT.IfChange
message DeviceId {
  // A hardware ID - precisely which TBD
  optional string device_id = 1;
}

message LogData {
  optional bytes log_blob = 1;
}

message LogMetadata {
  optional uint32 blob_size = 1;
  google.protobuf.Timestamp timestamp = 2;
  DeviceId device = 3;
  optional LogEncryptionType encryption_type = 4;
}

message LogKey {
  optional KeyEncryptionType key_encryption_type = 1;
  optional bytes encrypted_symmetric_key = 2;
  optional bytes iv = 3;
  // The symmetric key again, encrypted on the device that wrote the batch with
  // its AES batch-wrap Keystore key: the 16-byte IV, then the AES/CBC/NoPadding
  // ciphertext. One authentication can unwrap the keys of many batches. Absent
  // from batches encrypted to an external key. encrypted_symmetric_key stays
  // the reference.
  optional bytes batch_wrapped_symmetric_key = 4;
  // Identifies the batch-wrap key that produced batch_wrapped_symmetric_key:
  // the first 8 bytes of its encryption of an all-zero block.
  optional bytes batch_wrap_key_id = 5;
}

message LogBatch {
  LogData data = 1;
  // Each batch has a single key: one symmetric key and its IV.
  LogKey key = 2;
  LogMetadata metadata = 3;
  // Position of this batch among the batches that the installation which wrote
  // it has signed, starting at 1. A gap means that a signed batch is missing.
  optional int64 sequence_number = 4;
  // Covers the serialized batch without this field: remove field 5 from the
  // batch file and verify the remaining bytes. Absent from batches written
  // before batches were signed and from batches that could not be signed.
  BatchSignature signature = 5;
}

// A signature made on the device by its batch-signing key: an attested EC P-256
// Android Keystore key that never leaves the device.
message BatchSignature {
  // DER-encoded ECDSA signature with SHA-256 (SHA256withECDSA).
  optional bytes signature = 1;
  // DER-encoded X.509 certificates of the signing key from Android key
  // attestation, leaf first. The leaf holds the public key that verifies
  // `signature`, and its attestation challenge is the device_id of the
  // installation that made the signature. Absent from format version 2
  // (LOG_ENCRYPTION_TYPE_AES_GCM_SEALED_METADATA) batches, which seal the chain
  // in SealedLogs.attestation_chain instead, so that their signature can only
  // be checked after decryption. The signature does not cover this field, so
  // recipients reject a format version 2 batch that carries a chain here.
  repeated bytes attestation_chain = 2;
}
// LINT.ThenChange(../../tools/analyst/crumbles_analyst.py)
